name: "Process Daily Puzzle Submission"

on:
  issues:
    types: [opened, labeled]

jobs:
  process-submission:
    if: |
      (github.event.action == 'opened' && contains(github.event.issue.body, '### Game Type') && !contains(github.event.issue.labels.*.name, 'daily-puzzle-submission')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'daily-puzzle-submission')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Process Submission
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: pnpm exec tsx scripts/process-submission.ts
        continue-on-error: true

      - name: Handle Validation Success
        if: steps.process.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('submission-summary.md', 'utf8');

            let isDuplicate = false;
            if (fs.existsSync('vars.env')) {
              const envContent = fs.readFileSync('vars.env', 'utf8');
              if (envContent.includes('IS_DUPLICATE=true')) {
                isDuplicate = true;
              }
            }

            // Add comment on the issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

            if (isDuplicate) {
              // Add duplicate label
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['duplicate']
              });

              // Close the duplicate issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
            } else {
              // Add pending-review label
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['pending-review']
              });
            }

      - name: Create Pull Request
        if: steps.process.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source vars.env
          if [ "$IS_DUPLICATE" = "true" ]; then
            echo "Skipping Pull Request creation for duplicate entry."
            exit 0
          fi
          BRANCH_NAME="update-registry-$GAME-$PUZZLE_ID"
          ISSUE_AUTHOR="${{ github.event.issue.user.login }}"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          pnpm exec prettier --write registry/*.json
          git add registry/*.json

          # Build commit message with properly formatted co-author trailers
          COMMIT_MSG="chore: update solver registry"
          COMMIT_MSG=$(printf '%s\n\nCo-authored-by: Muhammed Mustafa AKŞAM <info@muhammedaksam.com.tr>' "$COMMIT_MSG")

          # Add the issue author as co-author only if they are not the repo owner
          if [ "$ISSUE_AUTHOR" != "muhammedaksam" ]; then
            COMMIT_MSG=$(printf '%s\nCo-authored-by: %s <%s@users.noreply.github.com>' "$COMMIT_MSG" "$ISSUE_AUTHOR" "$ISSUE_AUTHOR")
          fi

          git commit -m "$COMMIT_MSG"

          git push origin "$BRANCH_NAME" --force

          gh pr create \
            --title "Update registry: $GAME #$PUZZLE_ID" \
            --body "This PR updates the solver registry based on a verified user submission in issue #${{ github.event.issue.number }}. Closes #${{ github.event.issue.number }}." \
            --base main \
            --head "$BRANCH_NAME" \
            --assignee "${{ github.event.issue.user.login }},muhammedaksam" \
            --reviewer "muhammedaksam"

      - name: Handle Validation Failure
        if: steps.process.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('submission-summary.md', 'utf8');

            // Add comment with validation error details
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

            // Add failure label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['validation-failed']
            });
